# yamllint disable rule:truthy
# The toolchain contract check, required on every pull request (a person's,
# the toolchain-manager's and Renovate's), so it runs with no path filter.
# It builds every toolchain under toolchains/ and checks it with
# giantswarm/agent-toolchains' contract check beside each Harness image it
# declares. The images are built locally and never pushed.
name: Toolchain contract

on:
  pull_request: {}
  merge_group: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    name: Toolchain contract
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout the contract check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: giantswarm/agent-toolchains
          ref: [[ .ContractRef ]]
          path: .toolchain-contract

      - name: Every toolchain keeps the contract
        run: |
          set -euo pipefail
          failed=0
          for dir in $(find toolchains -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sort); do
            name=$(basename "$dir")
            image="toolchain-contract/${name}:check"
            echo "::group::toolchain ${name}"
            docker build -t "$image" "$dir"
            declared=$(docker image inspect -f '{{index .Config.Labels "io.giantswarm.toolchain.name"}}' "$image")
            if [ "$declared" != "$name" ]; then
              echo "FAIL  ${dir}: io.giantswarm.toolchain.name is \"${declared}\", want \"${name}\""
              failed=1
            elif ! .toolchain-contract/scripts/toolchain-contract.sh "$image" .toolchain-contract/harnesses; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

# This file is a Helm values file for the toolchain-manager chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#
image:
  # -- Image repository below `registry.domain`.
  name: "giantswarm/toolchain-manager"
  # -- Image tag; empty is the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
registry:
  domain: gsoci.azurecr.io

replicaCount: 1

mcp:
  # -- Path of the MCP endpoint.
  path: /mcp

service:
  port: 8080

# -- How every MCP call is authenticated: muster forwards the person's Dex ID
# token as its bearer (the MCPServer's `auth.forwardToken`). With
# `auth.dex.issuerURL` set, every call needs a valid token and the source
# tools are served; empty serves the package and Dockerfile tools only, to
# anyone who reaches the Service.
auth:
  dex:
    # -- Dex issuer URL, as the tokens name it.
    issuerURL: ""
    # -- Where Dex's signing keys are fetched when the issuer's public name
    # does not resolve in the cluster; empty: discovered from the issuer.
    jwksURL: ""
    # -- Secret (name, key) in the release namespace holding the PEM CA of a
    # Dex with a private certificate; empty name trusts the system roots.
    caSecret:
      name: ""
      key: ca.crt
  # -- OAuth client ids whose Dex ID tokens are accepted: the platform client
  # and the audiences muster requires.
  trustedAudiences: []

# -- The installation's owners, who approve a source a person adds once
# before its toolchains are offered: Dex groups and verified emails. Without
# any, an added source is never approved.
owners:
  groups: []
  emails: []

# -- The toolchain sources the installation's configuration names, approved
# by being named here: each a GitHub repository (owner/name), the registry
# prefix its toolchains publish under, and the owning team: its GitHub team
# slug (`team`) and its Slack channel's ID (`slackChannel`, C0123ABCDE),
# where the outdated notices and a major update's ask go.
sources:
  - repository: giantswarm/agent-toolchains
    registry: gsoci.azurecr.io/giantswarm/agent-toolchains
    slackChannel: ""
    team: ""

github:
  # -- GitHub API.
  api: https://api.github.com
  # -- Provider App muster keeps the person's grant of the toolchain-manager's
  # GitHub App as: muster attaches the person's token in
  # `X-Muster-Grant-<app>` (an `aggregator.providerApps` entry of muster).
  grantApp: github
  # -- Where a repository's owner installs the App,
  # https://github.com/apps/<slug>/installations/new; add_source names it.
  appInstallURL: ""

updates:
  # -- How often the background job checks the pins of the toolchains the
  # manager wrote and marks the outdated ones (Go duration); 0 serves no
  # `update_toolchain`, `approve_update` and no outdated mark.
  interval: 6h

# -- klaus-gateway's team-review endpoint, where the outdated notices and a
# major update's ask with its Approve button are posted to a source's team
# channel. The manager calls it with its own projected ServiceAccount token,
# which klaus-gateway admits when its `reviews.allowedCallers` lists
# `system:serviceaccount:<namespace>:toolchain-manager`. Empty `url` posts
# nothing: the mark stays in the tools, and a major update waits for an
# approving review on GitHub.
klausGateway:
  # -- Base URL, such as http://klaus-gateway.klaus-gateway.svc.cluster.local:8080.
  url: ""
  # -- Audience of the projected token, klaus-gateway's `reviews.audience`.
  audience: klaus-gateway

crds:
  # -- Install the ToolchainSource CRD; kept on uninstall, so removing the
  # chart never removes an added source.
  install: true

muster:
  # -- muster's MCP endpoint, where `deprecate_toolchain` asks agent-manager,
  # as the person, which agents and Sessions use a toolchain. Rendered with
  # `agentManagerToolsPrefix`; either empty serves no `deprecate_toolchain`.
  mcpUrl: http://muster.agent-platform.svc.cluster.local:8090/mcp
  # -- agent-manager's tool prefix in muster.
  agentManagerToolsPrefix: x_agent-manager_
  mcpServer:
    # -- Register this server with muster: an `MCPServer` in the release
    # namespace, its tools `x_<name>_<tool>`. Needs `auth.dex.issuerURL`.
    enabled: false
    # -- MCPServer name, the tools' prefix.
    name: toolchain-manager
    # -- Name the Dev Portal shows for this server.
    displayName: Toolchain Manager
    autoStart: true
    description: "Toolchains for coding agents: sources, package search, binaries and the Dockerfile they are built from"
    # -- Tool call timeout in seconds; 0 keeps muster's default.
    timeout: 0
    # -- Audiences muster requests at login and forwards in the token.
    requiredAudiences: []
    # -- Pin the registration to the toolchain-manager's GitHub App instead
    # of `github.grantApp`'s provider App (the shape before muster kept
    # provider Apps): issuer (https://github.com/apps/<id>), expectedIssuer,
    # authorizationEndpoint, tokenEndpoint and clientCredentialsSecretRef
    # (name, namespace, clientIdKey, clientSecretKey) of muster's
    # `auth.authorizationServer`, `grantScope: subject`. The bearer is then
    # the person's App token, the Dex ID token arrives in
    # `X-Muster-Id-Token`, and a person without the grant is answered with
    # the App's sign-in link. Empty: provider Apps.
    authorizationServer: {}  # @schema additionalProperties: true
    # -- Labels added to (and overriding) the MCPServer's.
    labels: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: toolchaindeprecations.toolchain-manager.giantswarm.io
spec:
  group: toolchain-manager.giantswarm.io
  names:
    kind: ToolchainDeprecation
    listKind: ToolchainDeprecationList
    plural: toolchaindeprecations
    shortNames:
    - tcd
    singular: toolchaindeprecation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .spec.toolchain
      name: Toolchain
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.deprecatedBy
      name: Deprecated by
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ToolchainDeprecation is a toolchain, or a version of it, taken out of the
          offered list.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ToolchainDeprecationSpec names a deprecated toolchain of a source, or one
              of its versions. A deprecated version leaves the offered list; its release
              and image stay, since a suspended Session resumes only on the exact digest
              it started with.
            properties:
              deprecatedBy:
                description: |-
                  DeprecatedBy is the person who deprecated it: their verified email,
                  else their subject.
                type: string
              reason:
                description: Reason says why, for the people whose agents name it.
                type: string
              repository:
                description: Repository is the source's GitHub repository, owner/name.
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
                x-kubernetes-validations:
                - message: repository is immutable
                  rule: self == oldSelf
              toolchain:
                description: Toolchain is the toolchain's name.
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
                x-kubernetes-validations:
                - message: toolchain is immutable
                  rule: self == oldSelf
              version:
                description: |-
                  Version is the deprecated version, vX.Y.Z; empty deprecates the
                  toolchain with every version.
                pattern: ^(v[0-9]+\.[0-9]+\.[0-9]+)?$
                type: string
                x-kubernetes-validations:
                - message: version is immutable
                  rule: self == oldSelf
            required:
            - deprecatedBy
            - repository
            - toolchain
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}

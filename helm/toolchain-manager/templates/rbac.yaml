{{- /*
The ServiceAccount keeps the added sources and the deprecations in the
release namespace once the tools checked the caller: a person gets no right
on ToolchainSources or ToolchainDeprecations here, so only an installation
owner's approve_source records an approval (status), and only a person who
can push to a source, or an owner, deprecates its toolchains. Nothing else is
read or written.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: [toolchain-manager.giantswarm.io]
    resources: [toolchainsources]
    verbs: [get, list, create, delete]
  - apiGroups: [toolchain-manager.giantswarm.io]
    resources: [toolchainsources/status]
    verbs: [update]
  - apiGroups: [toolchain-manager.giantswarm.io]
    resources: [toolchaindeprecations]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "name" . }}
    namespace: {{ .Release.Namespace }}
